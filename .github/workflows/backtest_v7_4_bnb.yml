name: V7.4 BNB Final Confirmation
on:
  push:
    branches: [research/coin-specific-backtest]
    paths:
      - 'backtest_v7_4_bnb_confirmation.py'
      - '.github/workflows/backtest_v7_4_bnb.yml'
  workflow_dispatch:
jobs:
  confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify V7.4 source
        run: |
          python -m py_compile backtest_v7_4_bnb_confirmation.py
          python - <<'PY'
          from pathlib import Path
          s=Path('backtest_v7_4_bnb_confirmation.py').read_text()
          assert "'7.4.0'" in s
          assert "SYMBOL='BNBUSDT'" in s
          assert "LOCKED_RULE='momentum'" in s
          assert 'rules_reoptimized' in s
          print('V7.4 SOURCE OK')
          PY
      - name: Run V7.4
        run: python backtest_v7_4_bnb_confirmation.py
      - name: Validate V7.4 result
        run: |
          test -s backtest_v7_4_bnb_confirmation_results.json
          python - <<'PY'
          import json
          d=json.load(open('backtest_v7_4_bnb_confirmation_results.json'))
          assert d['version']=='7.4.0'
          assert d['purpose']=='BNB_LOCKED_RULE_FINAL_CONFIRMATION'
          assert d['symbol']=='BNBUSDT'
          assert d['mode']=='1D_BULL_FILTER'
          assert d['locked_rule']=='momentum'
          assert d['rules_reoptimized'] is False
          assert len(d['windows'])==6
          assert d['production_changed'] is False
          print('V7.4 RESULT OK')
          print('positive_windows=',d['positive_windows'],'trades=',d['combined_last_18m']['trades'],'PF=',d['combined_last_18m']['profit_factor'],'expectancy=',d['combined_last_18m']['expectancy_pct'],'PASS=',d['confirmation_pass'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bnb-v7-4-final-confirmation-results
          path: backtest_v7_4_bnb_confirmation_results.json
