name: Production Crypto Alert Tests
# V7.10 research gate is executed in coin-specific-oos-gate\n# Retry stamp: 2026-09-25T14:24:48.073Z

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile production modules
        run: python -m py_compile app/main.py app/crypto/price.py app/crypto/analyzer.py app/crypto/strategy.py

      - name: Run strategy tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v


  coin-specific-oos-gate:
    name: coin-specific-oos-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/v7-10-coin-specific-oos-gate

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run V7.10 OOS gate
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
        run: python v7_10_coin_specific_oos_gate.py

      - name: Validate V7.10 research-only result
        run: |
          python - <<'PY'
          import json
          with open("v7_10_coin_specific_oos_gate_results.json") as f:
              r=json.load(f)
          assert r["production_changed"] is False
          assert r["version"] == "7.10.0-coin-specific-oos-gate"
          assert set(r["targets"]) == {"BTCUSDT","ETHUSDT","SOLUSDT","XRPUSDT"}
          print("V7.10 VALIDATION PASSED")
          print("coins_with_oos_candidates:", r["coins_with_oos_candidates"])
          print("total_oos_candidates:", r["total_oos_candidates"])
          PY

      - name: Upload V7.10 results
        uses: actions/upload-artifact@v4
        with:
          name: v7-10-coin-specific-oos-gate-results
          path: v7_10_coin_specific_oos_gate_results.json
