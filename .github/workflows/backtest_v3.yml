name: Crypto Alert Backtest V3

on:
  push:
    paths:
      - 'backtest_v3.py'
      - '.github/workflows/backtest_v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install requests

      - name: Run V3 backtest
        run: python backtest_v3.py --months 12

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: crypto-alert-backtest-v3
          path: |
            backtest_v3_results.json
            backtest_results.txt

      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backtest_v3_results.json backtest_results.txt
          git diff --cached --quiet || git commit -m 'Add V3 backtest results'
          git push
