name: Coin Specific Backtest

on:
  push:
    branches:
      - research/coin-specific-backtest
    paths:
      - 'backtest_coin_specific.py'
      - 'backtest_v7_2_oos.py'
      - '.github/workflows/backtest_coin_specific.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source revision
        run: |
          git rev-parse HEAD
          python -m py_compile backtest_coin_specific.py backtest_v7_2_oos.py
      - name: Run V7.1 research backtest
        run: python backtest_coin_specific.py --months 24
      - name: Validate V7.1
        run: |
          test -s backtest_coin_specific_results.json
          python - <<'PY'
          import json
          d=json.load(open('backtest_coin_specific_results.json'))
          assert d.get('version') == '7.1.0', d.get('version')
          assert d.get('purpose') == 'MULTI_TIMEFRAME_WALK_FORWARD_RESEARCH', d.get('purpose')
          assert isinstance(d.get('results'),dict) and len(d['results'])==9
          for c,r in d['results'].items(): assert r.get('error') is None, f'{c}: {r.get("error")}'
          print('V7.1 OK')
          PY
      - name: Run V7.2 TRUE OOS
        run: python backtest_v7_2_oos.py --months 24
      - name: Validate V7.2 TRUE OOS
        run: |
          test -s backtest_v7_2_oos_results.json
          python - <<'PY'
          import json
          d=json.load(open('backtest_v7_2_oos_results.json'))
          assert d['version']=='7.2.0', d.get('version')
          assert d['purpose']=='TRUE_OUT_OF_SAMPLE_RULE_VALIDATION', d.get('purpose')
          assert d['selection_locked_before_oos'] is True
          assert len(d['results'])==9
          for c,r in d['results'].items():
              assert r.get('error') is None, f'{c}: {r.get("error")}'
          print('V7.2 TRUE OOS OK')
          for c,r in d['results'].items():
              print(c, [(m,v['selection_rule'],v['true_oos']['trades'],v['true_oos']['profit_factor'],v['true_oos']['expectancy_pct'],v['oos_pass']) for m,v in r['summary'].items()])
          PY
      - name: Upload V7.1 result
        uses: actions/upload-artifact@v4
        with:
          name: coin-specific-backtest-v7-1-clean-results
          path: backtest_coin_specific_results.json
      - name: Upload V7.2 OOS result
        uses: actions/upload-artifact@v4
        with:
          name: coin-specific-backtest-v7-2-oos-results
          path: backtest_v7_2_oos_results.json
