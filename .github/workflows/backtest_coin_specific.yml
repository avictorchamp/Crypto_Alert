name: Coin Specific Backtest

on:
  push:
    branches:
      - research/coin-specific-backtest
    paths:
      - 'backtest_coin_specific.py'
      - '.github/workflows/backtest_coin_specific.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Show revision
        run: |
          echo "V7.1 CLEAN RUN"
          git rev-parse HEAD
          python -m py_compile backtest_coin_specific.py
      - name: Run research backtest
        run: python backtest_coin_specific.py --months 24
      - name: Validate V7.1 result
        run: |
          test -s backtest_coin_specific_results.json
          python - <<'PY'
          import json
          d=json.load(open('backtest_coin_specific_results.json'))
          assert d.get('version') == '7.1.0', d.get('version')
          assert d.get('purpose') == 'MULTI_TIMEFRAME_WALK_FORWARD_RESEARCH', d.get('purpose')
          assert len(d.get('results',{})) == 9, len(d.get('results',{}))
          for coin,r in d['results'].items():
              assert r.get('error') is None, f'{coin}: {r.get("error")}'
              assert r.get('candles_1h',0) >= 1000, f'{coin} 1H={r.get("candles_1h")}'
              assert r.get('candles_1d',0) >= 50, f'{coin} 1D={r.get("candles_1d")}'
              assert set(r.get('summary',{})) == {'1H_ONLY','1D_BULL_FILTER'}, coin
          print('V7.1 CLEAN RESULT OK')
          PY
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: coin-specific-backtest-v7-1-clean-results
          path: backtest_coin_specific_results.json
