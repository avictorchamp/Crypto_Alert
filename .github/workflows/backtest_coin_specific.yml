name: Coin Specific Backtest

on:
  push:
    branches:
      - research/coin-specific-backtest
    paths:
      - 'backtest_coin_specific.py'
      - '.github/workflows/backtest_coin_specific.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Show revision and compile
        run: |
          echo "V7.1 CLEAN RUN"
          git rev-parse HEAD
          python -m py_compile backtest_coin_specific.py
      - name: Run research backtest
        run: python backtest_coin_specific.py --months 24
      - name: Validate V7.1 result schema
        run: |
          test -s backtest_coin_specific_results.json
          python - <<'PY'
          import json
          d=json.load(open('backtest_coin_specific_results.json'))
          assert d.get('version') == '7.1.0', d.get('version')
          assert d.get('purpose') == 'MULTI_TIMEFRAME_WALK_FORWARD_RESEARCH', d.get('purpose')
          results=d.get('results',{})
          assert isinstance(results,dict) and len(results)==9, f'coins={len(results)}'
          expected={'1H_ONLY','1D_BULL_FILTER'}
          for coin,r in results.items():
              assert r.get('error') is None, f'{coin}: {r.get("error")}'
              assert r.get('candles_1h',0) >= 1000, f'{coin} 1H={r.get("candles_1h")}'
              assert r.get('candles_1d',0) >= 50, f'{coin} 1D={r.get("candles_1d")}'
              summary=r.get('summary')
              assert isinstance(summary,dict), f'{coin}: summary type={type(summary).__name__}'
              keys=set(summary.keys())
              assert keys==expected, f'{coin}: summary keys={sorted(keys)}'
              for mode in expected:
                  assert isinstance(summary[mode],dict), f'{coin}: {mode} is not dict'
                  assert 'rules' in summary[mode] and 'selected' in summary[mode], f'{coin}: malformed {mode}'
          print('V7.1 CLEAN RESULT OK')
          print('coins=',len(results))
          for coin,r in results.items():
              print(coin, '1H=',r['candles_1h'], '1D=',r['candles_1d'], 'selected_1H=',r['summary']['1H_ONLY']['selected'], 'selected_1D1H=',r['summary']['1D_BULL_FILTER']['selected'])
          PY
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: coin-specific-backtest-v7-1-clean-results
          path: backtest_coin_specific_results.json
