name: Coin Specific Backtest
on:
  push:
    paths:
      - 'backtest_coin_specific.py'
      - '.github/workflows/backtest_coin_specific.yml'
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run research backtest
        run: python backtest_coin_specific.py --months 24
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: coin-specific-backtest-results
          path: backtest_coin_specific_results.json
