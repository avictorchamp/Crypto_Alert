name: Crypto Alert Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - 'backtest.py'
      - '.github/workflows/backtest.yml'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Run 12-month backtest and save report
        run: python backtest.py --months 12 > backtest_results.txt 2>&1

      - name: Upload backtest report
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results-12m
          path: backtest_results.txt
          retention-days: 30

      - name: Commit report to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest_results.txt
          git diff --cached --quiet && exit 0
          git commit -m "Add 12-month backtest results"
          git push
