name: V7.17 XRP Live Integration
on:
  push:
    branches: [main]
    paths:
      - "app/crypto/xrp_v715_live.py"
      - "app/main.py"
      - "app/crypto/price.py"
      - ".github/workflows/v7-17-xrp-live-integration.yml"
  workflow_dispatch:
jobs:
  xrp-live-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate frozen edges, matching, cooldown, Telegram failure and alert-only safety
        run: |
          python - <<'PY'
          from unittest.mock import patch
          from app.crypto import xrp_v715_live as x

          def candle(price, volume):
              return [0, 0, 0, 0, str(price), str(volume)]

          edges = x.FROZEN_EDGES
          assert edges["momentum_20"][1] == -0.02519325696190744
          assert edges["vol_ratio"][3] == 1.2366720351063054
          matched, buckets = x.evaluate(
              {"price": 1, "momentum_20": -0.03, "vol_ratio": 1.5}, edges
          )
          assert matched and buckets == {
              "momentum_20_bucket": 0, "vol_ratio_bucket": 3
          }
          unmatched, _ = x.evaluate(
              {"price": 1, "momentum_20": 0.0, "vol_ratio": 1.5}, edges
          )
          assert not unmatched

          # Falling prices + latest volume spike create a deterministic test match.
          candles = [
              candle(1.0 - i * 0.002, 200 if i == 99 else 100)
              for i in range(100)
          ]
          x._last_sent = 0.0
          with patch.object(x, "send_message") as send:
              first = x.process_xrp_live(candles, edges, now=1000, send=True)
              second = x.process_xrp_live(candles, edges, now=1001, send=True)
              assert first["matched"] and first["sent"]
              assert send.call_count == 1
              assert not second["sent"]
              assert second["cooldown_remaining"] > 0
              assert first["automatic_trading"] is False

          # Failed Telegram send must not consume the cooldown; a retry can send.
          x._last_sent = 0.0
          with patch.object(x, "send_message", side_effect=RuntimeError("simulated Telegram failure")):
              try:
                  x.process_xrp_live(candles, edges, now=2000, send=True)
              except RuntimeError:
                  pass
              else:
                  raise AssertionError("Telegram failure should propagate")
          assert x._last_sent == 0.0
          with patch.object(x, "send_message") as send:
              retry = x.process_xrp_live(candles, edges, now=2001, send=True)
              assert retry["sent"] and send.call_count == 1
          x._last_sent = 0.0
          print("V7.17 LIVE INTEGRATION VALIDATION PASSED")
          PY
