name: Crypto Alert V5 Edge Discovery
on:
  workflow_dispatch:
  push:
    paths:
      - 'backtest_v5.py'
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V5 Edge Discovery
        run: python backtest_v5.py --months 12
      - name: Publish results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backtest_v5_results.json
          git diff --cached --quiet || git commit -m 'chore: publish V5 edge discovery results'
          git push
      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto-alert-v5-edge-results
          path: backtest_v5_results.json
