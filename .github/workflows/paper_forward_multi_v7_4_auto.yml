# V7.4 Multi-Coin Paper Forward Automation
# RESEARCH ONLY - NO LIVE TRADING
name: V7.4 Multi-Coin Paper Forward Auto

on:
  workflow_dispatch:
  schedule:
    - cron: "20 0 * * *"

permissions:
  contents: write

concurrency:
  group: v7-4-multi-coin-paper-forward
  cancel-in-progress: false

jobs:
  paper-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout multi-coin research branch
        uses: actions/checkout@v4
        with:
          ref: research/multi-coin-forward-v7-4
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify source
        run: python -m py_compile paper_forward_multi_v7_4.py

      - name: Run BTC ETH SOL XRP paper forward snapshots
        shell: bash
        run: |
          set -euo pipefail
          for symbol in BTCUSDT ETHUSDT SOLUSDT XRPUSDT; do
            echo "===== ${symbol} ====="
            PAPER_FORWARD_SYMBOL="${symbol}" python paper_forward_multi_v7_4.py
          done

      - name: Validate all snapshots
        run: |
          python - <<'PY'
          import json
          symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT"]
          for symbol in symbols:
              path = f"paper_forward_v7_4_{symbol}_log.json"
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
              assert data["version"] == "7.4.0"
              assert data["purpose"] == "MULTI_COIN_PAPER_FORWARD"
              assert data["symbol"] == symbol
              assert data["rule"] == "momentum"
              assert data["context"] == "1D_BULL_FILTER"
              assert data["forward_test_start_utc"] == "2026-08-28T23:00:00+00:00"
              assert data["production_changed"] is False
              assert isinstance(data["observations"], list)
              assert isinstance(data["summary"], dict)
              required = ["closed_trades","winning_trades","losing_trades","win_rate_pct","average_return_pct","expectancy_pct","profit_factor","max_drawdown_pct","open_trades"]
              for key in required:
                  assert key in data["summary"], (symbol, key)
              timestamps = [int(x["signal_candle_close_ms"]) for x in data["observations"]]
              assert timestamps == sorted(timestamps)
              assert len(timestamps) == len(set(timestamps))
              print(symbol, data["summary"], "observations=", len(data["observations"]))
          print("MULTI-COIN PAPER FORWARD VALIDATION PASSED")
          PY

      - name: Persist cumulative paper logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_forward_v7_4_BTCUSDT_log.json paper_forward_v7_4_ETHUSDT_log.json paper_forward_v7_4_SOLUSDT_log.json paper_forward_v7_4_XRPUSDT_log.json
          if git diff --cached --quiet; then
            echo "No multi-coin paper-forward log changes."
          else
            git commit -m "chore: update multi-coin V7.4 paper forward logs"
            git push origin HEAD:research/multi-coin-forward-v7-4
          fi

      - name: Upload multi-coin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: multi-coin-v7-4-paper-forward
          path: paper_forward_v7_4_*USDT_log.json
          if-no-files-found: error
