name: V8.1 Regime-Aware Walk-Forward
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: read
jobs:
  regime-aware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V8.1 research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Run V8.1 regime-aware walk-forward
        run: python v8_1_regime_aware.py
      - name: Validate V8.1 result
        run: |
          python - <<'PY'
          import json
          d=json.load(open("v8_1_regime_aware_results.json"))
          assert d["production_changed"] is False
          assert len(d["results"]) == 4
          assert all(len(v["folds"]) == 4 for v in d["results"].values())
          print("V8.1 VALIDATION PASSED")
          PY
      - name: Upload V8.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: v8-1-regime-aware-results
          path: v8_1_regime_aware_results.json
