name: V7.9 Exact Production Gate Walk-Forward
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V7.9 research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run V7.9 exact production walk-forward
        run: python v7_9_exact_production_walk_forward.py
      - name: Validate V7.9 result
        run: |
          python - <<'PY'
          import json
          d=json.load(open("v7_9_exact_production_results.json"))
          assert d["production_changed"] is False
          assert len(d["results"]) == 4
          assert all(len(v["folds"]) == 4 for v in d["results"].values())
          print("V7.9 VALIDATION PASSED")
          PY
      - name: Upload V7.9 artifact
        uses: actions/upload-artifact@v4
        with:
          name: v7-9-exact-production-results
          path: v7_9_exact_production_results.json


  eth-holdout-v83:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V8.3 research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Run V8.3 ETH holdout confirmation
        run: python v8_3_eth_holdout_confirmation.py
      - name: Validate V8.3 result
        run: |
          python - <<'PY'
          import json
          d=json.load(open("v8_3_eth_holdout_results.json"))
          assert d["production_changed"] is False
          assert d["coin"] == "ETHUSDT"
          assert d["locked_rule"]["volume_threshold"] == 1.5
          assert d["holdout"]["horizon_hours"] == 24
          print("V8.3 VALIDATION PASSED")
          PY
      - name: Upload V8.3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: v8-3-eth-holdout-results
          path: v8_3_eth_holdout_results.json

  eth-forward-v84:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V8.4 research branch
        uses: actions/checkout@v4
        with:
          ref: research/v8-4-eth-forward
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run V8.4 ETH forward paper validation
        run: python v8_4_eth_forward_paper.py
      - name: Validate V8.4 result
        run: |
          python - <<'PY'
          import json
          d=json.load(open("v8_4_eth_forward_log.json"))
          assert d["production_changed"] is False
          assert d["symbol"] == "ETHUSDT"
          assert d["locked_rule"]["volume_threshold"] == 1.5
          assert d["locked_rule"]["volume_condition"] == "volume_ratio > 1.5"
          assert d["horizon_hours"] == 24
          print("V8.4 VALIDATION PASSED")
          print("observations =", len(d["observations"]))
          print("summary =", d["summary"])
          PY
      - name: Upload V8.4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: v8-4-eth-forward-results
          path: v8_4_eth_forward_log.json
