name: V8.2 Best Single Regime Walk-Forward
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: read
jobs:
  regime-single:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V8.2 research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Run V8.2 best single regime walk-forward
        run: python v8_2_best_single_regime.py
      - name: Validate V8.2 result
        run: |
          python - <<'PY'
          import json
          d=json.load(open("v8_2_best_single_regime_results.json"))
          assert d["production_changed"] is False
          assert len(d["results"]) == 4
          assert all(len(v["folds"]) == 4 for v in d["results"].values())
          print("V8.2 VALIDATION PASSED")
          PY
      - name: Upload V8.2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: v8-2-best-single-regime-results
          path: v8_2_best_single_regime_results.json


  eth-holdout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V8.3 research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Run V8.3 ETH holdout confirmation
        run: python v8_3_eth_holdout_confirmation.py
      - name: Validate V8.3 result
        run: |
          python - <<'PY'
          import json
          d=json.load(open("v8_3_eth_holdout_results.json"))
          assert d["production_changed"] is False
          assert d["coin"] == "ETHUSDT"
          assert d["locked_rule"]["volume_threshold"] == 1.5
          assert d["holdout"]["horizon_hours"] == 24
          print("V8.3 VALIDATION PASSED")
          PY
      - name: Upload V8.3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: v8-3-eth-holdout-results
          path: v8_3_eth_holdout_results.json
