name: V7.2 True OOS Backtest
on:
  push:
    branches: [research/coin-specific-backtest]
    paths:
      - 'backtest_v7_2_oos.py'
      - '.github/workflows/backtest_v7_2_oos.yml'
  workflow_dispatch:
jobs:
  oos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run V7.2
        run: python backtest_v7_2_oos.py --months 24
      - name: Validate true OOS artifact
        run: |
          test -s backtest_v7_2_oos_results.json
          python - <<'PY'
          import json
          d=json.load(open('backtest_v7_2_oos_results.json'))
          assert d['version']=='7.2.0'
          assert d['purpose']=='TRUE_OUT_OF_SAMPLE_RULE_VALIDATION'
          assert d['selection_locked_before_oos'] is True
          assert len(d['results'])==9
          print('V7.2 TRUE OOS OK')
          for c,r in d['results'].items():
              print(c, {m:(v['selection_rule'],v['true_oos']) for m,v in r['summary'].items()})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: coin-specific-backtest-v7-2-oos-results
          path: backtest_v7_2_oos_results.json
